name: Excavator

on:
  workflow_dispatch:
  repository_dispatch:
    types: [excavator]
  schedule:
    # Daily at 01:23 UTC
    - cron: "23 1 * * *"

permissions:
  contents: write

concurrency:
  group: excavator
  cancel-in-progress: false

jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    continue-on-error: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SKIP_UPDATED: 1
      THROW_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Excavate
        uses: ScoopInstaller/GitHubActions@main
